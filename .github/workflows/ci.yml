name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'assets/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'assets/**']
  workflow_dispatch:

# A new push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# JDK 17 is the only JDK installed: it runs Gradle and satisfies the `toolchain(17)` modules.
# setup-gradle caches ~/.gradle; only runs on main write to the cache.
jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck detekt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checks-reports
          path: '**/build/reports/'

  android:
    name: Android build + JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # iOS targets are skipped on Linux (kotlin.native.ignoreDisabledTargets=true).
      - name: Build
        run: ./gradlew assemble
      - name: Unit tests
        run: ./gradlew jvmTest :mockcat-gradle-plugin:test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: '**/build/reports/'

  ios:
    name: iOS build + simulator tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Kotlin/Native compiler + iOS dependencies (~1 GB), re-downloaded only when versions change.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Build
        run: ./gradlew compileKotlinIosSimulatorArm64 linkDebugFrameworkIosSimulatorArm64
      - name: Unit tests
        run: ./gradlew iosSimulatorArm64Test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reports
          path: '**/build/reports/'
